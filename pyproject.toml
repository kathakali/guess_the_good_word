[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-the-good-word"
version = "1.0.0"
description = "A Flask word guessing game with 3, 4, 5, and 6 letter levels."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Flask>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["guess_the_good_word*"]

[tool.setuptools.package-data]
guess_the_good_word = [
  "data/*.txt",
  "templates/*.html",
  "static/css/*.css",
  "static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
